<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dandan Vertical sample</title>
<style>
  @font-face { font-family: "Dandan Vertical"; src: url("../dist/Dandan-Vertical.woff2") format("woff2"); font-display: block; }
  body { margin: 0; background: #fbfaf7; color: #1d1c1a; font: 15px/1.4 system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 0; padding: 20px 24px; width: max-content; }
  .panel { padding: 0 22px; border-left: 1px solid #e4e0d8; }
  .panel:last-child { border-left: 0; }
  .label { color: #6b675f; margin-bottom: 10px; white-space: nowrap; }
  .label b { display: block; color: #1d1c1a; font-weight: 600; }
  .text {
    writing-mode: vertical-rl;
    font-family: "Dandan Vertical";
    font-size: 30px;
    line-height: 2.1;
    height: 13.5em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel"><div class="label"><b>All furigana</b>default</div>
    <div class="text">今日は図書館で日本語の勉強をします。経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="panel"><div class="label"><b>Knows N5</b>"ss05" 1</div>
    <div class="text" style="font-feature-settings: 'ss05' 1">今日は図書館で日本語の勉強をします。経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="panel"><div class="label"><b>Knows N3-N5</b>"ss03" 1</div>
    <div class="text" style="font-feature-settings: 'ss03' 1">今日は図書館で日本語の勉強をします。経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="panel"><div class="label"><b>Furigana off</b>"ss10" 1</div>
    <div class="text" style="font-feature-settings: 'ss10' 1">今日は図書館で日本語の勉強をします。経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
</div>
</body>
</html>
