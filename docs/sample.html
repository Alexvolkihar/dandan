<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dandan sample</title>
<style>
  @font-face { font-family: "Dandan"; src: url("../dist/Dandan.woff2") format("woff2"); font-display: block; }
  body { margin: 0; background: #fbfaf7; color: #1d1c1a; font: 15px/1.4 system-ui, sans-serif; }
  .wrap { padding: 22px 28px 10px; width: 1000px; }
  .row { display: grid; grid-template-columns: 170px 1fr; align-items: center; border-top: 1px solid #e4e0d8; padding: 6px 0; }
  .row:first-child { border-top: 0; }
  .label { color: #6b675f; }
  .label b { display: block; color: #1d1c1a; font-weight: 600; }
  .text { font-family: "Dandan"; font-size: 28px; line-height: 1.75; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><div class="label"><b>All furigana</b>default</div>
    <div class="text">今日は図書館で日本語の勉強をします。<br>経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="row"><div class="label"><b>Knows N5</b>"ss05" 1</div>
    <div class="text" style="font-feature-settings: 'ss05' 1">今日は図書館で日本語の勉強をします。<br>経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="row"><div class="label"><b>Knows N3-N5</b>"ss03" 1</div>
    <div class="text" style="font-feature-settings: 'ss03' 1">今日は図書館で日本語の勉強をします。<br>経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
  <div class="row"><div class="label"><b>Furigana off</b>"calt" 0</div>
    <div class="text" style="font-feature-settings: 'calt' 0">今日は図書館で日本語の勉強をします。<br>経済の状況は複雑ですが、政府は対策を検討しています。</div></div>
</div>
</body>
</html>
