name: Release

# Push a tag such as v0.2.0 to build every level and attach the fonts to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fonts:
    name: Build and publish the fonts
    runs-on: ubuntu-latest
    # build-all makes 18 fonts (6 levels x Dandan, Dandan Vertical, Dandan Duo), about 3 minutes each.
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      # Same cache as ci.yml: downloaded sources only, keyed on the pins in dandan/fetch.py.
      - name: Restore the source data
        uses: actions/cache@v6
        with:
          path: |
            cache/NotoSansJP-VF.ttf
            cache/NotoSansJP-OFL.txt
            cache/JMdict_e.gz
            cache/JmdictFurigana.json.tar.gz
            cache/jlpt-*.csv
          key: dandan-sources-${{ hashFiles('dandan/fetch.py') }}

      - name: Fetch the base font and the dictionaries
        run: python -m dandan fetch

      - name: Build every level of the three fonts
        run: python -m dandan build-all

      # The Duo is compared with capped Dandan and Dandan Vertical builds at every level.
      - name: Test the built fonts
        run: python -m pytest -v
        env:
          DANDAN_DIST: dist
          DANDAN_PARITY_LEVELS: all,N5,N4,N3,N2,N1

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Package the browser extension
        run: node extension/scripts/build.mjs

      - name: Attach the fonts and the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/*.woff2 dist/*.ttf OFL.txt site/public/fonts/NOTICE.txt extension/dist/*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --title "Dandan $TAG" --generate-notes --verify-tag
          fi
